# Lectic persistent-goal plugin config
#
# Import this file to add the persistent-goal lifecycle. The :goal macro
# enables goal_kit for the active interlocutor when it starts a goal.

kits:
  - name: goal_kit
    description: Complete or hand off the active persistent goal.
    tools:
      - name: goal_handoff
        boilerplate: false
        usage: |
          Hand off the active persistent goal to a fresh session.

          Call this only after bringing the workspace to a coherent
          stopping point. BRIEFING must be a standalone briefing for
          the successor. Include work completed, decisions and
          constraints, files changed, checks and their results,
          unresolved problems or risks, and the next concrete action.

          This must be your final tool call in the current session.
        exec: |
          #!/usr/bin/env bash
          set -euo pipefail
          exec "$GOAL_PLUGIN_ROOT/lectic-goal.ts" \
            handoff \
            --briefing "$BRIEFING" \
            --json
        env:
          GOAL_PLUGIN_ROOT: local:./
        schema:
          BRIEFING:
            type: string
            description: Standalone briefing for the successor session.

      - name: goal_complete
        boilerplate: false
        usage: |
          Mark the entire persistent goal complete.

          Call this only after every requested deliverable is finished
          and relevant verification has passed. SUMMARY must record the
          outcome and the verification performed.
        exec: |
          #!/usr/bin/env bash
          set -euo pipefail
          exec "$GOAL_PLUGIN_ROOT/lectic-goal.ts" \
            complete \
            --summary "$SUMMARY" \
            --json
        env:
          GOAL_PLUGIN_ROOT: local:./
        schema:
          SUMMARY:
            type: string
            description: Completion summary and verification evidence.

macros:
  - name: goal
    description: Set a persistent goal for the active interlocutor.
    env:
      GOAL_PLUGIN_ROOT: local:./
    pre: |
      exec:#!/usr/bin/env bash
      set -euo pipefail

      # A merge emitted by a trusted pre macro is applied as a side effect.
      # Keep it in historical turns so the toolkit remains enabled when the
      # conversation is loaded again. Goal names reject quotes, backslashes,
      # and control characters, so this interpolation is valid JSON.
      printf '%s%s%s\n' \
        ':merge_yaml[{"interlocutor":{"name":"' \
        "$LECTIC_INTERLOCUTOR" \
        '","tools":[{"kit":"goal_kit","name":"goal_kit"}]}}]'

      # Historical :goal calls only replay the configuration side effect.
      if [[ -n "${MESSAGE_INDEX:-}" \
        && "$MESSAGE_INDEX" != "${MESSAGES_LENGTH:-}" ]]; then
        exit 0
      fi

      exec "$GOAL_PLUGIN_ROOT/lectic-goal.ts" set --goal "$ARG"

hooks:
  - name: goal_resume
    on: user_first
    inline: true
    env:
      GOAL_PLUGIN_PATH: local:./lectic-goal.ts
    do: '"$GOAL_PLUGIN_PATH" resume'

  - name: goal_final
    on: assistant_final
    inline: true
    env:
      GOAL_PLUGIN_PATH: local:./lectic-goal.ts
    do: '"$GOAL_PLUGIN_PATH" final'
